<header class="site-header">
    <div class="site-shell site-header-inner">
        <a href="{% url 'movies:home' %}" class="site-brand" aria-label="Nexo, inicio">
            <span class="site-brand-mark"><i data-lucide="layers" class="h-5 w-5" aria-hidden="true"></i></span>
            <span><span class="site-brand-name">Nexo</span><span class="site-brand-tagline">Cine, noticias y ORM</span></span>
        </a>
        <nav aria-label="Navegación principal" class="site-nav">
            <a href="{% url 'movies:home' %}" {% if request.resolver_match.view_name == 'movies:home' %}aria-current="page"{% endif %}>Inicio</a>
            <a href="{% url 'movies:catalog' %}" {% if request.resolver_match.namespace == 'movies' and request.resolver_match.url_name != 'home' %}aria-current="page"{% endif %}>Películas</a>
            <a href="{% url 'news:home' %}" {% if request.resolver_match.namespace == 'news' %}aria-current="page"{% endif %}>Noticias</a>
            <a href="{% url 'front_page' %}" {% if request.resolver_match.view_name == 'front_page' %}aria-current="page"{% endif %}>Blog ORM</a>
        </nav>
        <a href="{% url 'admin:index' %}" class="site-admin"><i data-lucide="shield" class="h-4 w-4" aria-hidden="true"></i>Admin</a>
    </div>
</header>
